name: Deploy website via SFTP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sftp.yml'
      - 'website/**'
      - 'scripts/build-search-pages.mjs'
  workflow_dispatch:
    inputs:
      full_upload:
        description: Upload every website file, ignoring the remote manifest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sftp-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare searchable offer pages
        run: node scripts/build-search-pages.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SFTP client
        run: python -m pip install paramiko==4.0.0

      - name: Test incremental deployment
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Upload website via SFTP
        env:
          SFTP_URL: ${{ secrets.SFTP_URL }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          FULL_UPLOAD: ${{ inputs.full_upload || false }}
        run: |
          args=()
          if [ "$FULL_UPLOAD" = "true" ]; then
            args+=(--full-upload)
          fi
          python scripts/deploy_sftp.py "${args[@]}"
